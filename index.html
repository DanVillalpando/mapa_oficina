<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Personal — CCOPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f0f0;color:#222;overflow:hidden}
#header{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;height:48px}
#header h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search{font-size:14px;padding:4px 10px;border:1.5px solid #ccc;border-radius:20px;outline:none;width:170px}
#search:focus{border-color:#1565C0}
#stat-count{font-size:13px;color:#888;white-space:nowrap}
#legend{background:#fff;padding:5px 16px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e8e8e8;font-size:12.5px;align-items:center}
.leg{display:flex;align-items:center;gap:4px;color:#555}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leg-sep{width:1px;height:14px;background:#ddd;margin:0 4px}
#toolbar{background:#fff;padding:6px 16px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e0e0e0}
.filter-btn{font-size:13px;padding:3px 10px;border-radius:20px;border:1.5px solid #ccc;background:#fff;color:#555;cursor:pointer;transition:all .15s;font-weight:500}
.filter-btn.active{font-weight:700}
.fb-all.active{color:#333;border-color:#333;background:#f0f0f0}
.fb-ccops.active{color:#1565C0;border-color:#1565C0;background:#E3F2FD}
.fb-dpc.active{color:#E65100;border-color:#E65100;background:#FFF3E0}
.fb-dsaa.active{color:#2E7D32;border-color:#2E7D32;background:#E8F5E9}
.fb-dnaj.active{color:#6A1B9A;border-color:#6A1B9A;background:#F3E5F5}
#mode-btn{font-size:13px;padding:3px 11px;border-radius:20px;border:1.5px solid #1565C0;color:#1565C0;background:#fff;cursor:pointer;font-weight:600;transition:all .15s}
#mode-btn.active{background:#1565C0;color:#fff}
#export-btn{font-size:13px;padding:3px 11px;border-radius:20px;border:1.5px solid #888;color:#555;background:#fff;cursor:pointer}
#pendientes-btn{font-size:13px;padding:3px 11px;border-radius:20px;border:1.5px solid #757575;color:#555;background:#fff;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .15s;margin-left:auto}
#pendientes-btn.active{background:#757575;color:#fff}
#pendientes-badge{background:#757575;color:#fff;border-radius:10px;padding:1px 6px;font-size:12px;font-weight:700}
#pendientes-btn.active #pendientes-badge{background:rgba(255,255,255,0.25)}

/* Indicador de modo activo */
#layout-indicator{font-size:12px;color:#aaa;padding:0 4px;white-space:nowrap;display:flex;align-items:center;gap:4px}
#layout-dot{width:7px;height:7px;border-radius:50%;background:#aaa;display:inline-block}
#layout-indicator.horizontal #layout-dot{background:#1565C0}
#layout-indicator.vertical #layout-dot{background:#2E7D32}

/* Loading overlay */
#loading-overlay{position:fixed;inset:0;background:rgba(240,240,240,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px;transition:opacity .3s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
#loading-spinner{width:32px;height:32px;border:3px solid #ddd;border-top-color:#1565C0;border-radius:50%;animation:spin .7s linear infinite}
#loading-text{font-size:15px;color:#888}
@keyframes spin{to{transform:rotate(360deg)}}

#map-container{position:relative;overflow:hidden;height:calc(100vh - 120px);background:#ccc;cursor:grab;display:flex;align-items:center;justify-content:center}
#map-container.locate-mode{cursor:crosshair}
#map-container:active:not(.locate-mode){cursor:grabbing}
#map-wrap{position:relative;width:100%;height:100%}
#floor-img{display:block;width:100%;height:100%;object-fit:contain}
#pins-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:all;cursor:pointer;z-index:10}
.pin-circle{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 5px rgba(0,0,0,0.3);letter-spacing:-.3px;user-select:none}
.pin:hover .pin-circle{transform:scale(1.5);box-shadow:0 3px 12px rgba(0,0,0,0.35)}
.pin.hidden{display:none !important}
.pin.drag-active .pin-circle{transform:scale(1.6);box-shadow:0 0 0 3px #FFD600,0 4px 12px rgba(0,0,0,0.4)}
.pin.highlighted .pin-circle{box-shadow:0 0 0 3px #FFD600,0 2px 8px rgba(0,0,0,0.3)}
#pendientes-panel{position:fixed;top:120px;right:0;width:285px;background:#fff;border-left:3px solid #bbb;border-top:1px solid #ddd;display:none;z-index:300;height:calc(100vh - 120px);overflow-y:auto;box-shadow:-4px 0 16px rgba(0,0,0,0.1)}
#pendientes-panel-header{font-size:15px;font-weight:700;padding:12px 14px 10px;border-bottom:1px solid #eee;color:#555;position:sticky;top:0;background:#fff;z-index:1;display:flex;align-items:center;justify-content:space-between}
#pendientes-panel-header span{font-size:13px;font-weight:400;color:#aaa}
.pend-card{padding:10px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .1s}
.pend-card:hover{background:#f8f8f8}
.pend-card.search-dim{opacity:0.3}
.pend-card-nombre{font-size:14px;font-weight:600;color:#333;margin-bottom:2px}
.pend-card-sub{font-size:13px;color:#999;line-height:1.4}
.pend-area-tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:10px;color:#fff;margin-top:3px}
#panel{position:fixed;bottom:20px;right:18px;width:270px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;display:none;z-index:400;box-shadow:0 8px 28px rgba(0,0,0,0.14);transition:right .2s}
#panel.shift{right:303px}
#panel-nombre{font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:4px;line-height:1.3;padding-right:20px}
.panel-badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f2f2f2;font-size:14px;gap:6px}
.info-row:last-child{border-bottom:none}
.info-label{color:#999;flex-shrink:0}
.info-val{color:#222;text-align:right;word-break:break-word}
.coords-row{background:#f8f8f8;border-radius:6px;padding:6px 8px;margin-top:8px;font-size:13px;font-family:monospace;color:#555;display:flex;justify-content:space-between;align-items:center}
.copy-btn{font-size:12px;padding:2px 7px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer}
.copy-btn:hover{background:#f0f0f0}
#close-btn{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;color:#bbb;font-size:19px;line-height:1}
#close-btn:hover{color:#333}
#edit-hint{font-size:12px;color:#bbb;margin-top:6px;text-align:center;line-height:1.4}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:14px;padding:8px 18px;border-radius:8px;display:none;z-index:500;font-family:monospace;pointer-events:none}

/* Móvil: ajustes de UI */
@media (max-width: 767px) {
  #header h1{font-size:14px}
  #search{width:120px}
  #legend{display:none}
  #map-container{height:calc(100vh - 88px);overflow-y:auto;overflow-x:hidden;cursor:default}
  #map-wrap{width:100%;height:auto;display:block}
  #floor-img{width:100%;height:auto;object-fit:unset}
  #pins-layer{height:auto;position:absolute;top:0;left:0;width:100%}
  .pin-circle{width:20px;height:20px;font-size:9.5px}
  #panel{width:calc(100vw - 32px);right:16px;bottom:12px}
  #panel.shift{right:16px}
  #pendientes-panel{width:100%;top:88px;height:calc(100vh - 88px)}
}
/* ── Tooltip con foto ── */
.pin-tooltip {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  padding: 8px;
  width: 130px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  z-index: 200; /*Se cambia de 50 a 200*/
  white-space: normal;
  /* Por defecto aparece ARRIBA */
  bottom: calc(100% + 8px);
  top: auto;
}
.pin:hover {
  z-index: 200 !important;
}
.pin-tooltip { opacity: 1; }
  
/* Si el pin tiene clase .tooltip-below, aparece ABAJO */
.pin.tooltip-below .pin-tooltip {
  top: calc(100% + 8px);
  bottom: auto;
}

/* Evitar que se corte por los lados */
.pin.tooltip-left .pin-tooltip {
  left: 0;
  transform: none;
}
.pin.tooltip-right .pin-tooltip {
  left: auto;
  right: 0;
  transform: none;
}

.pin-tooltip img {
  width: 72px; height: 72px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  border: 2px solid #eee;
  display: block;
  margin: 0 auto 5px;
}
.pin-tooltip-nombre {
  font-size: 11px;
  font-weight: 600;
  color: #222;
  line-height: 1.3;
}
.pin-tooltip-noimg {
  font-size: 11px;
  font-weight: 600;
  color: #222;
  padding: 4px 0;
  line-height: 1.3;
}

  if (window.screen && window.screen.orientation) {
    const type = window.screen.orientation.type; // 'landscape-primary', 'portrait-primary', etc.
    return type.startsWith('portrait') ? 'vertical' : 'horizontal';
  }
  return window.innerWidth <= CONFIG.mobileBreakpoint ? 'vertical' : 'horizontal';
}

// ─────────────────────────────────────────────
//  CARGA DE RECURSOS (imagen + coords JSON)
// ─────────────────────────────────────────────
async function loadLayout(layout) {
  if (layout === currentLayout) return; // nada cambió
  currentLayout = layout;

  showLoading(true);
  panel.style.display = 'none';

  try {
    // Carga paralela: imagen y JSON de coordenadas
    const [coordsData] = await Promise.all([
      fetch(CONFIG.coords[layout]).then(r => {
        if (!r.ok) throw new Error(`No se pudo cargar ${CONFIG.coords[layout]}`);
        return r.json();
      }),
      new Promise((resolve, reject) => {
        img.onload  = resolve;
        img.onerror = () => reject(new Error(`No se pudo cargar ${CONFIG.img[layout]}`));
        img.src = CONFIG.img[layout];
      })
    ]);

    // Mezcla: datos base del personal + coordenadas del JSON externo
    const coordsMap = {};
    coordsData.forEach(c => { coordsMap[c.id] = { x: c.x, y: c.y }; });

    devices = personalBase.map(d => ({
      ...d,
      x: coordsMap[d.id]?.x ?? d.x ?? 50,
      y: coordsMap[d.id]?.y ?? d.y ?? 50
    }));

    // Actualiza indicador de modo
    layoutInd.className = 'layout-indicator ' + layout;
    layoutLbl.textContent = layout === 'horizontal' ? '🖥 PC' : '📱 Móvil';

    initPins();
  } catch (err) {
    showToast('⚠ Error al cargar: ' + err.message);
    console.error(err);
  } finally {
    showLoading(false);
  }
}

function showLoading(visible) {
  overlay.classList.toggle('hidden', !visible);
}

// ─────────────────────────────────────────────
//  LISTENER DE ROTACIÓN / RESIZE
// ─────────────────────────────────────────────
let resizeTimer;
function onLayoutChange() {
  clearTimeout(resizeTimer);
  // Pequeño debounce para evitar cargas múltiples durante el resize
  resizeTimer = setTimeout(() => {
    const newLayout = detectLayout();
    if (newLayout !== currentLayout) {
      loadLayout(newLayout);
    }
  }, 200);
}

// screen.orientation es el evento más preciso en móvil
if (window.screen?.orientation) {
  window.screen.orientation.addEventListener('change', onLayoutChange);
}
// window resize como fallback (PC al redimensionar la ventana)
window.addEventListener('resize', onLayoutChange);

// ─────────────────────────────────────────────
//  INICIALIZACIÓN DE PINS
// ─────────────────────────────────────────────
function initPins() {
  layer.innerHTML = '';
  devices.filter(d => d.grupo === 'mapa').forEach(d => {
    const pin = document.createElement('div');
    pin.className = 'pin'; pin.dataset.id = d.id; pin.dataset.area = d.area;
    pin.style.left = d.x + '%'; pin.style.top = d.y + '%';
    const c = document.createElement('div');
    c.className = 'pin-circle'; c.style.background = d.color;
    const p = d.nombre.trim().split(' ');
    c.textContent = (p[0]?.[0] || '').toUpperCase() + (p[1]?.[0] || '').toUpperCase();
    pin.appendChild(c);
    // Tooltip fotos
    const tt = document.createElement('div');
    tt.className = 'pin-tooltip';
    if (d.foto) {
      tt.innerHTML = `<img src="fotos_personal_ccops/${d.foto}" alt="${d.nombre}" onerror="this.style.display='none'">
        <div class="pin-tooltip-nombre">${d.nombre}</div>`;
    } else {
      tt.innerHTML = `<div class="pin-tooltip-noimg">${d.nombre}</div>`;
    }
    pin.appendChild(tt); // Suguerencia de Claude para mostrar fotos
    pin.addEventListener('click', e => { if (!locateMode) { e.stopPropagation(); showPanel(d.id); } });
    makeDraggable(pin, d);
    layer.appendChild(pin);
    // Ajuste de posición del tooltip según ubicación del pin
    (function ajustarTooltip() {
      const y = parseFloat(pin.style.top);
      const x = parseFloat(pin.style.left);
      if (y < 25) pin.classList.add('tooltip-below');
      if (x < 15) pin.classList.add('tooltip-left');
      if (x > 85) pin.classList.add('tooltip-right');
    })();
  });
  buildPendientesPanel(); updateCounts(); applyFilters();
}

// ─────────────────────────────────────────────
//  PANEL PENDIENTES
// ─────────────────────────────────────────────
function buildPendientesPanel() {
  const list = document.getElementById('pendientes-list');
  list.innerHTML = '';
  const pending = devices.filter(d => d.grupo === 'pendiente');
  document.getElementById('pendientes-badge').textContent = pending.length;
  document.getElementById('pend-subtitle').textContent = `— ${pending.length} personas`;
  pending.forEach(d => {
    const card = document.createElement('div');
    card.className = 'pend-card'; card.dataset.uid = d.uid;
    card.innerHTML = `<div class="pend-card-nombre">${d.nombre}</div>
      <div class="pend-card-sub">${d.adscripcion || d.area || '—'}</div>
      ${d.categoria ? `<div class="pend-card-sub">${d.categoria}</div>` : ''}
      <div><span class="pend-area-tag" style="background:${d.color}">${d.area || '—'}</span></div>`;
    card.addEventListener('click', () => showPanelData(d));
    list.appendChild(card);
  });
}

// ─────────────────────────────────────────────
//  PANEL DETALLE
// ─────────────────────────────────────────────
function showPanel(id) { const d = devices.find(x => x.id === id); if (d) showPanelData(d); }
function showPanelData(d) {
  activeId = d.id;
  document.getElementById('panel-nombre').textContent = d.nombre;
  const badge = document.getElementById('panel-badge');
  badge.textContent = d.estatus; badge.style.background = d.ecolor;
  const rows = document.getElementById('p-rows'); rows.innerHTML = '';
  const fields = [['Lugar', d.lugar], ['Área', d.area || '—'], ['Adscripción', d.adscripcion || '—'], ['Nómina', d.nomina || '—'], ['Categoría', d.categoria || '—']];
  if (d.matricula) fields.push(['Matrícula', d.matricula]);
  fields.forEach(([l, v]) => {
    const r = document.createElement('div'); r.className = 'info-row';
    r.innerHTML = `<span class="info-label">${l}</span><span class="info-val">${v}</span>`;
    rows.appendChild(r);
  });
  const cr = document.getElementById('coords-row'), hint = document.getElementById('edit-hint');
  if (d.grupo === 'pendiente') { cr.style.display = 'none'; hint.style.display = 'none'; }
  else { cr.style.display = 'flex'; hint.style.display = 'block'; updatePanelCoords(d); }
  panel.classList.toggle('shift', pendOpen);
  panel.style.display = 'block';
}
function updatePanelCoords(d) { document.getElementById('pin-coords').textContent = `x: ${d.x.toFixed(2)}  y: ${d.y.toFixed(2)}`; }

document.getElementById('copy-coords-btn').onclick = () => {
  const d = devices.find(x => x.id === activeId);
  if (d) navigator.clipboard.writeText(`x:${d.x.toFixed(2)}, y:${d.y.toFixed(2)}`).then(() => showToast('Coordenadas copiadas ✓'));
};
document.getElementById('close-btn').onclick = () => panel.style.display = 'none';
mapCont.addEventListener('click', e => { if (e.target === mapCont || e.target === img || e.target === mapWrap) panel.style.display = 'none'; });

document.getElementById('pendientes-btn').addEventListener('click', () => {
  pendOpen = !pendOpen;
  document.getElementById('pendientes-btn').classList.toggle('active', pendOpen);
  document.getElementById('pendientes-panel').style.display = pendOpen ? 'block' : 'none';
  if (panel.style.display === 'block') panel.classList.toggle('shift', pendOpen);
});

// ─────────────────────────────────────────────
//  DRAG (sin cambios respecto al original)
// ─────────────────────────────────────────────
function makeDraggable(pin, d) {
  let dragging = false, startX, startY;
  pin.addEventListener('mousedown', e => {
    if (locateMode) return; e.preventDefault(); dragging = false; startX = e.clientX; startY = e.clientY;
    const onMove = mv => {
      if (!dragging && Math.hypot(mv.clientX - startX, mv.clientY - startY) > 4) { dragging = true; pin.classList.add('drag-active'); }
      if (!dragging) return;
      const rect = img.getBoundingClientRect();
      d.x = Math.min(100, Math.max(0, ((mv.clientX - rect.left) / rect.width) * 100));
      d.y = Math.min(100, Math.max(0, ((mv.clientY - rect.top) / rect.height) * 100));
      pin.style.left = d.x + '%'; pin.style.top = d.y + '%';
      if (activeId === d.id) updatePanelCoords(d);
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp);
      pin.classList.remove('drag-active');
      if (dragging) showToast(`${d.nombre.split(' ')[0]} → x:${d.x.toFixed(1)} y:${d.y.toFixed(1)}`);
      else showPanel(d.id); dragging = false;
    };
    window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
  });
}

// ─────────────────────────────────────────────
//  MODO UBICAR
// ─────────────────────────────────────────────
const modeBtn = document.getElementById('mode-btn');
modeBtn.addEventListener('click', () => {
  locateMode = !locateMode; modeBtn.classList.toggle('active', locateMode);
  mapCont.classList.toggle('locate-mode', locateMode);
  showToast(locateMode ? 'Modo ubicar activo — clic en el plano' : 'Modo ubicar desactivado');
});
mapWrap.addEventListener('click', e => {
  if (!locateMode) return;
  const rect = img.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2);
  const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2);
  navigator.clipboard.writeText(`x:${x}, y:${y}`).catch(() => {});
  showToast(`📋 ${x} , ${y}`);
});

// ─────────────────────────────────────────────
//  EXPORTAR — incluye el layout activo en el nombre
// ─────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const out = devices.map(d => ({ id: d.id, uid: d.uid, nombre: d.nombre, x: +d.x.toFixed(2), y: +d.y.toFixed(2) }));
  const filename = `posiciones_personal_${currentLayout}.json`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
  a.download = filename; a.click();
  showToast(`${filename} descargado ✓`);
});

// ─────────────────────────────────────────────
//  FILTROS Y BÚSQUEDA
// ─────────────────────────────────────────────
let currentArea = 'all', currentSearch = '';
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); currentArea = btn.dataset.area; applyFilters();
  });
});
document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value.toLowerCase().trim(); applyFilters();
  if (currentSearch) {
    const matchPend = devices.some(d => d.grupo === 'pendiente' && d.nombre.toLowerCase().includes(currentSearch));
    if (matchPend && !pendOpen) { pendOpen = true; document.getElementById('pendientes-btn').classList.add('active'); document.getElementById('pendientes-panel').style.display = 'block'; }
  }
  document.querySelectorAll('.pend-card').forEach(card => {
    const uid = card.dataset.uid; const d = devices.find(x => x.uid === uid);
    card.classList.toggle('search-dim', !!(currentSearch && d && !d.nombre.toLowerCase().includes(currentSearch)));
  });
});

function applyFilters() {
  let v = 0;
  document.querySelectorAll('.pin').forEach(pin => {
    const d = devices.find(x => x.id === +pin.dataset.id); if (!d) return;
    const ok = (currentArea === 'all' || d.area === currentArea) && (!currentSearch || d.nombre.toLowerCase().includes(currentSearch));
    pin.classList.toggle('hidden', !ok); pin.classList.toggle('highlighted', ok && currentSearch.length > 0);
    if (ok) v++;
  });
  const vp = currentSearch ? devices.filter(d => d.grupo === 'pendiente' && d.nombre.toLowerCase().includes(currentSearch)).length : 0;
  document.getElementById('stat-count').textContent = currentSearch
    ? `${v + vp} coincidencia${(v + vp) !== 1 ? 's' : ''}`
    : `${v} personas en plano`;
}

function updateCounts() {
  const c = {};
  devices.filter(d => d.grupo === 'mapa').forEach(d => { c[d.area] = (c[d.area] || 0) + 1; });
  document.getElementById('cnt-all').textContent = devices.filter(d => d.grupo === 'mapa').length;
  document.getElementById('cnt-ccops').textContent = c['CCOPS'] || 0;
  document.getElementById('cnt-dpc').textContent = c['DPC'] || 0;
  document.getElementById('cnt-dsaa').textContent = c['DSAA'] || 0;
  document.getElementById('cnt-dnaj').textContent = c['DNAJ'] || 0;
}

function showToast(msg) { toast.textContent = msg; toast.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.style.display = 'none', 2800); }

// ─────────────────────────────────────────────
//  ARRANQUE
// ─────────────────────────────────────────────
loadLayout(detectLayout());
</script>
</body>
</html>
