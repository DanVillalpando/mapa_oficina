<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Personal — CCOPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f0f0;color:#222;overflow:hidden}
#header{background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;height:48px}
#header h1{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search{font-size:12px;padding:4px 10px;border:1.5px solid #ccc;border-radius:20px;outline:none;width:170px}
#search:focus{border-color:#1565C0}
#stat-count{font-size:11px;color:#888;white-space:nowrap}
#legend{background:#fff;padding:5px 16px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e8e8e8;font-size:10.5px;align-items:center}
.leg{display:flex;align-items:center;gap:4px;color:#555}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leg-sep{width:1px;height:14px;background:#ddd;margin:0 4px}
#toolbar{background:#fff;padding:6px 16px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e0e0e0}
.filter-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1.5px solid #ccc;background:#fff;color:#555;cursor:pointer;transition:all .15s;font-weight:500}
.filter-btn.active{font-weight:700}
.fb-all.active{color:#333;border-color:#333;background:#f0f0f0}
.fb-ccops.active{color:#1565C0;border-color:#1565C0;background:#E3F2FD}
.fb-dpc.active{color:#E65100;border-color:#E65100;background:#FFF3E0}
.fb-dsaa.active{color:#2E7D32;border-color:#2E7D32;background:#E8F5E9}
.fb-dnaj.active{color:#6A1B9A;border-color:#6A1B9A;background:#F3E5F5}
#mode-btn{font-size:11px;padding:3px 11px;border-radius:20px;border:1.5px solid #1565C0;color:#1565C0;background:#fff;cursor:pointer;font-weight:600;transition:all .15s}
#mode-btn.active{background:#1565C0;color:#fff}
#export-btn{font-size:11px;padding:3px 11px;border-radius:20px;border:1.5px solid #888;color:#555;background:#fff;cursor:pointer}
#pendientes-btn{font-size:11px;padding:3px 11px;border-radius:20px;border:1.5px solid #757575;color:#555;background:#fff;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .15s;margin-left:auto}
#pendientes-btn.active{background:#757575;color:#fff}
#pendientes-badge{background:#757575;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700}
#pendientes-btn.active #pendientes-badge{background:rgba(255,255,255,0.25)}
#map-container{position:relative;overflow:auto;height:calc(100vh - 120px);background:#ccc;cursor:grab}
#map-container.locate-mode{cursor:crosshair}
#map-container:active:not(.locate-mode){cursor:grabbing}
#map-wrap{position:relative;display:inline-block}
#floor-img{display:block;width:880px;height:auto}
#pins-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:all;cursor:pointer;z-index:10}
.pin-circle{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:#fff;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 5px rgba(0,0,0,0.3);letter-spacing:-.3px;user-select:none}
.pin:hover .pin-circle{transform:scale(1.5);box-shadow:0 3px 12px rgba(0,0,0,0.35)}
.pin.hidden{display:none !important}
.pin.drag-active .pin-circle{transform:scale(1.6);box-shadow:0 0 0 3px #FFD600,0 4px 12px rgba(0,0,0,0.4)}
.pin.highlighted .pin-circle{box-shadow:0 0 0 3px #FFD600,0 2px 8px rgba(0,0,0,0.3)}
/* Panel pendientes */
#pendientes-panel{position:fixed;top:120px;right:0;width:285px;background:#fff;border-left:3px solid #bbb;border-top:1px solid #ddd;display:none;z-index:300;height:calc(100vh - 120px);overflow-y:auto;box-shadow:-4px 0 16px rgba(0,0,0,0.1)}
#pendientes-panel-header{font-size:13px;font-weight:700;padding:12px 14px 10px;border-bottom:1px solid #eee;color:#555;position:sticky;top:0;background:#fff;z-index:1;display:flex;align-items:center;justify-content:space-between}
#pendientes-panel-header span{font-size:11px;font-weight:400;color:#aaa}
.pend-card{padding:10px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .1s}
.pend-card:hover{background:#f8f8f8}
.pend-card.search-dim{opacity:0.3}
.pend-card-nombre{font-size:12px;font-weight:600;color:#333;margin-bottom:2px}
.pend-card-sub{font-size:11px;color:#999;line-height:1.4}
.pend-area-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;color:#fff;margin-top:3px}
/* Panel detalle */
#panel{position:fixed;bottom:20px;right:18px;width:270px;background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;display:none;z-index:400;box-shadow:0 8px 28px rgba(0,0,0,0.14);transition:right .2s}
#panel.shift{right:303px}
#panel-nombre{font-size:13px;font-weight:700;color:#1a1a1a;margin-bottom:4px;line-height:1.3;padding-right:20px}
.panel-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;margin-bottom:10px}
.info-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f2f2f2;font-size:12px;gap:6px}
.info-row:last-child{border-bottom:none}
.info-label{color:#999;flex-shrink:0}
.info-val{color:#222;text-align:right;word-break:break-word}
.coords-row{background:#f8f8f8;border-radius:6px;padding:6px 8px;margin-top:8px;font-size:11px;font-family:monospace;color:#555;display:flex;justify-content:space-between;align-items:center}
.copy-btn{font-size:10px;padding:2px 7px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer}
.copy-btn:hover{background:#f0f0f0}
#close-btn{position:absolute;top:10px;right:12px;background:none;border:none;cursor:pointer;color:#bbb;font-size:17px;line-height:1}
#close-btn:hover{color:#333}
#edit-hint{font-size:10px;color:#bbb;margin-top:6px;text-align:center;line-height:1.4}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:12px;padding:8px 18px;border-radius:8px;display:none;z-index:500;font-family:monospace;pointer-events:none}
</style>
</head>

let devices = devicesData.map(d => ({...d}));
const layer=document.getElementById('pins-layer'), img=document.getElementById('floor-img'),
      mapWrap=document.getElementById('map-wrap'), mapCont=document.getElementById('map-container'),
      panel=document.getElementById('panel'), toast=document.getElementById('toast');
let locateMode=false, activeId=null, pendOpen=false, toastTimer;

function initPins(){
  layer.innerHTML='';
  devices.filter(d=>d.grupo==='mapa').forEach(d=>{
    const pin=document.createElement('div');
    pin.className='pin'; pin.dataset.id=d.id; pin.dataset.area=d.area;
    pin.style.left=d.x+'%'; pin.style.top=d.y+'%';
    const c=document.createElement('div');
    c.className='pin-circle'; c.style.background=d.color;
    const p=d.nombre.trim().split(' ');
    c.textContent=(p[0]?.[0]||'').toUpperCase()+(p[1]?.[0]||'').toUpperCase();
    c.title=d.nombre; pin.appendChild(c);
    pin.addEventListener('click',e=>{if(!locateMode){e.stopPropagation();showPanel(d.id);}});
    makeDraggable(pin,d); layer.appendChild(pin);
  });
  buildPendientesPanel(); updateCounts(); applyFilters();
}

function buildPendientesPanel(){
  const list=document.getElementById('pendientes-list');
  list.innerHTML='';
  const pending=devices.filter(d=>d.grupo==='pendiente');
  document.getElementById('pend-subtitle').textContent=`— ${pending.length} personas`;
  pending.forEach(d=>{
    const card=document.createElement('div');
    card.className='pend-card'; card.dataset.uid=d.uid;
    card.innerHTML=`<div class="pend-card-nombre">${d.nombre}</div>
      <div class="pend-card-sub">${d.adscripcion||d.area||'—'}</div>
      ${d.categoria?`<div class="pend-card-sub">${d.categoria}</div>`:''}
      <div><span class="pend-area-tag" style="background:${d.color}">${d.area||'—'}</span></div>`;
    card.addEventListener('click',()=>showPanelData(d));
    list.appendChild(card);
  });
}

function showPanel(id){const d=devices.find(x=>x.id===id);if(d)showPanelData(d);}
function showPanelData(d){
  activeId=d.id;
  document.getElementById('panel-nombre').textContent=d.nombre;
  const badge=document.getElementById('panel-badge');
  badge.textContent=d.estatus; badge.style.background=d.ecolor;
  const rows=document.getElementById('p-rows'); rows.innerHTML='';
  const fields=[['Lugar',d.lugar],['Área',d.area||'—'],['Adscripción',d.adscripcion||'—'],['Nómina',d.nomina||'—'],['Categoría',d.categoria||'—']];
  if(d.matricula) fields.push(['Matrícula',d.matricula]);
  fields.forEach(([l,v])=>{
    const r=document.createElement('div'); r.className='info-row';
    r.innerHTML=`<span class="info-label">${l}</span><span class="info-val">${v}</span>`;
    rows.appendChild(r);
  });
  const cr=document.getElementById('coords-row'), hint=document.getElementById('edit-hint');
  if(d.grupo==='pendiente'){cr.style.display='none';hint.style.display='none';}
  else{cr.style.display='flex';hint.style.display='block';updatePanelCoords(d);}
  panel.classList.toggle('shift',pendOpen);
  panel.style.display='block';
}
function updatePanelCoords(d){document.getElementById('pin-coords').textContent=`x: ${d.x.toFixed(2)}  y: ${d.y.toFixed(2)}`;}
document.getElementById('copy-coords-btn').onclick=()=>{
  const d=devices.find(x=>x.id===activeId);
  if(d) navigator.clipboard.writeText(`x:${d.x.toFixed(2)}, y:${d.y.toFixed(2)}`).then(()=>showToast('Coordenadas copiadas ✓'));
};
document.getElementById('close-btn').onclick=()=>panel.style.display='none';
mapCont.addEventListener('click',e=>{if(e.target===mapCont||e.target===img||e.target===mapWrap)panel.style.display='none';});

document.getElementById('pendientes-btn').addEventListener('click',()=>{
  pendOpen=!pendOpen;
  document.getElementById('pendientes-btn').classList.toggle('active',pendOpen);
  document.getElementById('pendientes-panel').style.display=pendOpen?'block':'none';
  if(panel.style.display==='block') panel.classList.toggle('shift',pendOpen);
});

function makeDraggable(pin,d){
  let dragging=false,startX,startY;
  pin.addEventListener('mousedown',e=>{
    if(locateMode) return; e.preventDefault(); dragging=false; startX=e.clientX; startY=e.clientY;
    const onMove=mv=>{
      if(!dragging&&Math.hypot(mv.clientX-startX,mv.clientY-startY)>4){dragging=true;pin.classList.add('drag-active');}
      if(!dragging) return;
      const rect=img.getBoundingClientRect();
      d.x=Math.min(100,Math.max(0,((mv.clientX-rect.left)/rect.width)*100));
      d.y=Math.min(100,Math.max(0,((mv.clientY-rect.top)/rect.height)*100));
      pin.style.left=d.x+'%'; pin.style.top=d.y+'%';
      if(activeId===d.id) updatePanelCoords(d);
    };
    const onUp=()=>{
      window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp);
      pin.classList.remove('drag-active');
      if(dragging) showToast(`${d.nombre.split(' ')[0]} → x:${d.x.toFixed(1)} y:${d.y.toFixed(1)}`);
      else showPanel(d.id); dragging=false;
    };
    window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
  });
}

const modeBtn=document.getElementById('mode-btn');
modeBtn.addEventListener('click',()=>{
  locateMode=!locateMode; modeBtn.classList.toggle('active',locateMode);
  mapCont.classList.toggle('locate-mode',locateMode);
  showToast(locateMode?'Modo ubicar activo — clic en el plano':'Modo ubicar desactivado');
});
mapWrap.addEventListener('click',e=>{
  if(!locateMode) return;
  const rect=img.getBoundingClientRect();
  const x=((e.clientX-rect.left)/rect.width*100).toFixed(2);
  const y=((e.clientY-rect.top)/rect.height*100).toFixed(2);
  navigator.clipboard.writeText(`x:${x}, y:${y}`).catch(()=>{});
  showToast(`📋 ${x} , ${y}`);
});

document.getElementById('export-btn').addEventListener('click',()=>{
  const out=devices.map(d=>({id:d.id,uid:d.uid,nombre:d.nombre,x:+d.x.toFixed(2),y:+d.y.toFixed(2)}));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download='posiciones_personal.json'; a.click();
  showToast('posiciones_personal.json descargado ✓');
});

let currentArea='all', currentSearch='';
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentArea=btn.dataset.area; applyFilters();
  });
});
document.getElementById('search').addEventListener('input',e=>{
  currentSearch=e.target.value.toLowerCase().trim(); applyFilters();
  if(currentSearch){
    const matchPend=devices.some(d=>d.grupo==='pendiente'&&d.nombre.toLowerCase().includes(currentSearch));
    if(matchPend&&!pendOpen){pendOpen=true;document.getElementById('pendientes-btn').classList.add('active');document.getElementById('pendientes-panel').style.display='block';}
  }
  document.querySelectorAll('.pend-card').forEach(card=>{
    const uid=card.dataset.uid; const d=devices.find(x=>x.uid===uid);
    card.classList.toggle('search-dim',!!(currentSearch&&d&&!d.nombre.toLowerCase().includes(currentSearch)));
  });
});

function applyFilters(){
  let v=0;
  document.querySelectorAll('.pin').forEach(pin=>{
    const d=devices.find(x=>x.id===+pin.dataset.id); if(!d) return;
    const ok=(currentArea==='all'||d.area===currentArea)&&(!currentSearch||d.nombre.toLowerCase().includes(currentSearch));
    pin.classList.toggle('hidden',!ok); pin.classList.toggle('highlighted',ok&&currentSearch.length>0);
    if(ok) v++;
  });
  const vp=currentSearch?devices.filter(d=>d.grupo==='pendiente'&&d.nombre.toLowerCase().includes(currentSearch)).length:0;
  document.getElementById('stat-count').textContent=currentSearch
    ?`${v+vp} coincidencia${(v+vp)!==1?'s':''}`
    :`${v} personas en plano`;
}

function updateCounts(){
  const c={};
  devices.filter(d=>d.grupo==='mapa').forEach(d=>{c[d.area]=(c[d.area]||0)+1});
  document.getElementById('cnt-all').textContent=devices.filter(d=>d.grupo==='mapa').length;
  document.getElementById('cnt-ccops').textContent=c['CCOPS']||0;
  document.getElementById('cnt-dpc').textContent=c['DPC']||0;
  document.getElementById('cnt-dsaa').textContent=c['DSAA']||0;
  document.getElementById('cnt-dnaj').textContent=c['DNAJ']||0;
}

function showToast(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',2800);}

img.onload=initPins; if(img.complete) initPins();
</script>
</body>
</html>
